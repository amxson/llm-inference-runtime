[project]
name = "llm-runtime-vercel"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.0+cpu",
    "transformers==5.17.0",
    "fastapi==0.143.0",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
